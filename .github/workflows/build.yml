name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  container-build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64
    steps:
      - name: env
        run: |
          cat /proc/cpuinfo
          free -m
          pwd
          ls -la
      - name: checkout - project
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: checkout - atmosphere
        uses: actions/checkout@v4
        with:
          repository: Atmosphere-NX/Atmosphere
          ref: 1.9.2
          path: atmosphere
          submodules: recursive
      - name: verify - atmosphere checkout
        run: |
          ls -la atmosphere
          ls -la atmosphere/libraries
          if [ ! -d "atmosphere/libraries/libstratosphere" ]; then
            echo "Error: atmosphere/libraries/libstratosphere directory not found"
            exit 1
          fi
          if [ ! -d "atmosphere/libraries/libvapours" ]; then
            echo "Error: atmosphere/libraries/libvapours directory not found"
            exit 1
          fi
      - name: deps - libnx
        run: |
          git clone https://github.com/switchbrew/libnx.git /tmp/libnx
          make -C /tmp/libnx install -j4
      - name: deps - ams libs
        run: |
          # Build libstratosphere (produces libstratosphere.a)
          make -C atmosphere/libraries/libstratosphere -j4
          # Create directories for headers and libraries
          mkdir -p lib/ams/libstratosphere/include lib/ams/libvapours/include
          # Copy libstratosphere headers and library
          cp -r atmosphere/libraries/libstratosphere/include/* lib/ams/libstratosphere/include/
          cp -r atmosphere/libraries/libstratosphere/out/nintendo_nx_arm64_armv8a/release/libstratosphere.a lib/ams/libstratosphere/
          # Copy libvapours headers (header-only, no libvapours.a)
          cp -r atmosphere/libraries/libvapours/include/* lib/ams/libvapours/include/
          # Verify copied files
          ls -la lib/ams/libstratosphere
          ls -la lib/ams/libvapours
      - name: build - FEAT_ALL
        run: |
          make clean
          make FEAT_ALL="Y" -j4
      - name: store - FEAT_ALL
        uses: actions/upload-artifact@v4
        with:
          name: sys-tweak.nsp
          path: out/sys-tweak.nsp
      - name: build - FEAT_ALL TOGL_LOGGING
        run: |
          make clean
          make FEAT_ALL="Y" TOGL_LOGGING="Y" -j4
      - name: store - FEAT_ALL TOGL_LOGGING
        uses: actions/upload-artifact@v4
        with:
          name: sys-tweak_log.nsp
          path: out/sys-tweak.nsp
