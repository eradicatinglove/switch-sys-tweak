name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  container-build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64
    steps:
      - name: env
        run: |
          cat /proc/cpuinfo
          free -m
      - name: checkout - project
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: checkout - atmosphere
        uses: actions/checkout@v4
        with:
          repository: Atmosphere-NX/Atmosphere
          ref: 1.9.2
          path: atmosphere
          submodules: recursive
      - name: deps - libnx
        run: |
          git clone https://github.com/switchbrew/libnx.git /tmp/libnx
          make -C /tmp/libnx install -j4
      - name: deps - ams libs
        run: |
          make -C atmosphere/libstratosphere -j4
          make -C atmosphere/libvapours -j4
          mkdir -p lib/ams/libstratosphere/include lib/ams/libvapours/include
          cp -r atmosphere/libstratosphere/include/* lib/ams/libstratosphere/include/
          cp -r atmosphere/libvapours/include/* lib/ams/libvapours/include/
          cp -r atmosphere/libstratosphere/out/nintendo_nx_arm64_armv8a/release/libstratosphere.a lib/ams/libstratosphere/
          cp -r atmosphere/libvapours/out/nintendo_nx_arm64_armv8a/release/libvapours.a lib/ams/libvapours/
      - name: build - FEAT_ALL
        run: |
          make clean
          make FEAT_ALL="Y" -j4
      - name: store - FEAT_ALL
        uses: actions/upload-artifact@v4
        with:
          name: sys-tweak.nsp
          path: out/sys-tweak.nsp
      - name: build - FEAT_ALL TOGL_LOGGING
        run: |
          make clean
          make FEAT_ALL="Y" TOGL_LOGGING="Y" -j4
      - name: store - FEAT_ALL TOGL_LOGGING
        uses: actions/upload-artifact@v4
        with:
          name: sys-tweak_log.nsp
          path: out/sys-tweak.nsp
